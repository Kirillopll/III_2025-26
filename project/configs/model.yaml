data:
  raw_path: data/raw/application_train.csv
  target_column: TARGET
  id_columns:
    - SK_ID_CURR
  test_size: 0.2
  random_state: 42
  max_rows: 20000

training:
  selection_metric: average_precision
  models:
    dummy:
      enabled: true
    logistic_regression:
      enabled: true
      max_iter: 1000
      class_weight: balanced
    random_forest:
      enabled: true
      n_estimators: 80
      max_depth: 10
      class_weight: balanced_subsample

service:
  model_path: artifacts/credit_risk_model.joblib
  low_risk_threshold: 0.10
  high_risk_threshold: 0.25
